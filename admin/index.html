<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WNP Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1b18">
<link rel="manifest" href="/admin/manifest.json">
<link rel="icon" href="/admin/icon-192.png">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WNP Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#1d1b18; --ink-2:#2b2824; --paper:#f7f4ee; --card:#fff; --line:#e6e0d5; --line-2:#efeae1;
    --text:#26241f; --muted:#77716a; --gold:#b8935a; --gold-2:#9a7843;
    --green:#1f9d55; --wa:#1fa855; --red:#c0392b; --blue:#2f6fb5; --amber:#c98a12;
    --r:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:inherit}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.2px;color:var(--ink)}
  .hidden{display:none!important}

  /* ---------- buttons & inputs ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
  .btn:hover{border-color:#cfc6b6}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn-dark:hover{background:#000}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn-gold:hover{background:var(--gold-2)}
  .btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
  .btn-red{color:var(--red);border-color:#f0d3cf}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-block{width:100%}
  label.l{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
  .in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
  .in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,147,90,.15)}
  textarea.in{min-height:84px;resize:vertical}
  .field{margin-bottom:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;user-select:none}
  .switch input{display:none}
  .switch i{width:38px;height:22px;border-radius:20px;background:#d9d2c5;position:relative;transition:background .15s}
  .switch i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + i{background:var(--green)}
  .switch input:checked + i:after{left:19px}

  /* ---------- login ---------- */
  #login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--ink)}
  .login-box{width:100%;max-width:380px;background:var(--paper);border-radius:18px;padding:30px 26px}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .brand b{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--ink);letter-spacing:1px}
  .brand span{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .login-box p.sub{color:var(--muted);margin-bottom:22px}
  .msg{font-size:13.5px;margin-top:12px;min-height:1em}
  .msg.bad{color:var(--red)} .msg.ok{color:var(--green)}
  .link{background:none;border:0;color:var(--gold-2);font-weight:600;cursor:pointer;font-size:13.5px;padding:0}

  /* ---------- shell ---------- */
  #app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
  aside{background:var(--ink);color:#d8d2c7;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  aside .brand b{color:#fff;font-size:26px} aside .brand{padding:0 8px 22px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:500;color:#cfc8bb;cursor:pointer;position:relative}
  .nav a svg{width:19px;height:19px;flex:none}
  .nav a:hover{background:var(--ink-2);color:#fff}
  .nav a.on{background:var(--ink-2);color:#fff}
  .nav a.on:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
  .nav .badge{margin-left:auto;background:var(--gold);color:#fff;font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
  aside .foot{margin-top:auto;font-size:12.5px;color:#9c958a;padding:0 8px}
  aside .foot a{color:#d8d2c7}
  main{min-width:0;padding:26px 30px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .top h1{font-size:32px;line-height:1.1}
  .top .acts{display:flex;gap:8px;flex-wrap:wrap}
  .mobile-head{display:none}

  /* ---------- cards / lists ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{padding:14px 16px}
  .stat b{display:block;font-size:26px;font-family:'Cormorant Garamond',serif;color:var(--ink);line-height:1.1}
  .stat span{font-size:12.5px;color:var(--muted);font-weight:500}
  .stat.hl{background:var(--ink);border-color:var(--ink)} .stat.hl b{color:#fff} .stat.hl span{color:#cfc8bb}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .in{max-width:320px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip em{font-style:normal;opacity:.7;margin-left:3px}
  .qlist{overflow:hidden}
  .q{display:grid;grid-template-columns:10px minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .q:last-child{border-bottom:0}
  .q:hover{background:#fcfaf6}
  .q .dot{width:9px;height:9px;border-radius:50%;background:transparent}
  .q.new .dot{background:var(--gold)}
  .q .who{min-width:0}
  .q .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q .who span,.q .what span{font-size:13px;color:var(--muted)}
  .q.new .who b{color:var(--ink)}
  .q .what{min-width:0}
  .q .what b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q .meta{text-align:right;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;text-transform:capitalize;letter-spacing:.2px}
  .st-new{background:#f6ecd9;color:#8a6420} .st-contacted{background:#e3eefa;color:var(--blue)} .st-quoted{background:#efe6f8;color:#6b3fa0}
  .st-won{background:#dff3e7;color:var(--green)} .st-lost{background:#f1ece6;color:#7a7065} .st-spam{background:#f8e1de;color:var(--red)}
  .type-tag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-2)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
  .side-box{padding:16px}
  .side-box h3{font-size:20px;margin-bottom:10px}
  .bar{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:8px}
  .bar span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar i{display:block;height:6px;border-radius:4px;background:var(--gold);opacity:.75}
  .bar b{font-weight:600;min-width:22px;text-align:right}

  /* products */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .pcard{overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .pcard .img{aspect-ratio:4/3;background:#f1ece3 center/cover no-repeat;display:grid;place-items:center;color:#b3a993;font-size:13px;position:relative}
  .pcard .img .cnt{position:absolute;top:10px;left:10px;background:rgba(29,27,24,.85);color:#fff;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px}
  .pcard .img .off{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px}
  .pcard .body{padding:12px 14px 14px}
  .pcard h3{font-size:20px;line-height:1.15;margin-bottom:3px}
  .pcard p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard.inactive{opacity:.6}

  /* list rows (designs / offers / faq) */
  .rows{display:flex;flex-direction:column;gap:8px}
  .rowi{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .rowi .th{width:54px;height:54px;border-radius:8px;background:#f1ece3 center/cover no-repeat;flex:none}
  .rowi .tx{flex:1;min-width:0}
  .rowi .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowi .tx span{font-size:12.5px;color:var(--muted)}
  .rowi .ac{display:flex;gap:4px;flex:none}
  .rowi.inactive{opacity:.55}
  .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
  .ib svg{width:16px;height:16px}
  .ib:hover{border-color:#cfc6b6}
  .ib.red{color:var(--red)}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .gimg{position:relative;aspect-ratio:1;border-radius:10px;background:#f1ece3 center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
  .gimg .cov{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px}
  .gimg .gact{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:5px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .gimg .gact button{width:26px;height:26px;border-radius:7px;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:700}
  .gadd{aspect-ratio:1;border:1.5px dashed #cfc6b6;border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fcfaf6;padding:6px}
  .gadd:hover{border-color:var(--gold);color:var(--gold-2)}
  .gadd input{display:none}
  .uploading{aspect-ratio:1;border-radius:10px;background:#f1ece3;display:grid;place-items:center;font-size:12px;color:var(--muted)}

.gwrap{display:flex;flex-direction:column;gap:5px;min-width:0}
  .alt-in{padding:6px 8px;font-size:12px;border-radius:8px}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .gadd{min-height:92px}
  /* settings */
  .sgroup{padding:18px;margin-bottom:14px}
  .sgroup h3{font-size:21px;margin-bottom:12px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,18,15,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
  .drawer.on{transform:none}
  .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-top:calc(14px + var(--safe-t));border-bottom:1px solid var(--line);background:#fff}
  .dh h2{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .db{flex:1;overflow:auto;padding:18px;-webkit-overflow-scrolling:touch}
  .df{display:flex;gap:8px;padding:12px 18px;padding-bottom:calc(12px + var(--safe-b));border-top:1px solid var(--line);background:#fff}
  .df .grow{flex:1}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px;padding:14px 16px}
  .kv dt{color:var(--muted);font-weight:500}
  .kv dd{word-break:break-word;white-space:pre-wrap}
  .acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .sec-t{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-2);margin:18px 0 8px}

  /* toast */
  #toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);pointer-events:auto;max-width:92vw;animation:tin .2s ease}
  .toast.bad{background:var(--red)}
  .toast.gold{background:var(--gold-2);cursor:pointer}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .notice{padding:14px 16px;border-radius:12px;background:#fbf3e3;border:1px solid #efdcb6;font-size:14px;margin-bottom:16px}
  .notice b{color:var(--ink)}
  .spinner{width:18px;height:18px;border:2px solid #d9d2c5;border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{padding:60px;text-align:center}

  /* ---------- mobile ---------- */
  @media (max-width:860px){
    #app{grid-template-columns:minmax(0,1fr)}
    aside{position:fixed;inset:auto 0 0 0;top:auto;height:auto;padding:6px 6px calc(6px + var(--safe-b));z-index:30;flex-direction:row;border-top:1px solid #000}
    aside .brand,aside .foot{display:none}
    .nav{flex-direction:row;width:100%;justify-content:space-around;gap:0}
    .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;flex:1;text-align:center}
    .nav a.on:before{display:none}
    .nav a.on{background:transparent;color:var(--gold)}
    .nav a:hover{background:transparent}
    .nav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 5px;min-width:16px}
    .nav .lbl-long{display:none}
    main{padding:14px 14px calc(90px + var(--safe-b));padding-top:calc(14px + var(--safe-t))}
    .mobile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .mobile-head .brand b{font-size:22px}
    .top h1{font-size:28px}
    .stats{grid-template-columns:repeat(2,1fr);gap:8px}
    .split{grid-template-columns:minmax(0,1fr)}
    .q{grid-template-columns:8px minmax(0,1fr) auto;gap:10px;padding:12px}
    .q .what{grid-column:2 / 4;grid-row:2;margin-top:-6px}
    .toolbar .in{max-width:none}
    .row2{grid-template-columns:1fr}
    .kv{grid-template-columns:105px 1fr}
    .pgrid{grid-template-columns:repeat(2,1fr);gap:10px}
    .pcard h3{font-size:17px}
    .pcard p{display:none}
    #toasts{bottom:auto;top:calc(12px + var(--safe-t))}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <div class="brand"><b>WNP</b><span>Admin</span></div>
    <p class="sub" id="loginSub">Sign in to see queries and manage your website.</p>
    <div id="loginFields">
      <div class="field"><label class="l" for="lg_email">Email</label><input class="in" id="lg_email" type="email" autocomplete="username" required></div>
      <div class="field"><label class="l" for="lg_pass">Password</label><input class="in" id="lg_pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-dark btn-block" id="lg_btn" type="submit">Sign in</button>
      <p style="margin-top:14px;text-align:center"><button type="button" class="link" id="lg_forgot">Forgot password?</button></p>
    </div>
    <div id="resetFields" class="hidden">
      <div class="field"><label class="l" for="lg_new">New password (min 8 characters)</label><input class="in" id="lg_new" type="password" autocomplete="new-password"></div>
      <button class="btn btn-dark btn-block" id="lg_set" type="button">Save new password</button>
    </div>
    <p class="msg" id="lg_msg"></p>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside>
    <div class="brand"><b>WNP</b><span>Admin</span></div>
    <nav class="nav" id="nav">
      <a data-v="queries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H7l-3 3z"/><path d="M8 9h8M8 12h5"/></svg><span>Queries</span><span class="badge hidden" id="navBadge">0</span></a>
      <a data-v="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Products</span></a>
      <a data-v="content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg><span>Content</span><span class="badge hidden" id="navBadge2">0</span></a>
      <a data-v="website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg><span>Website</span></a>
      <a data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg><span>Alerts<span class="lbl-long"> &amp; Team</span></span></a>
    </nav>
    <div class="foot">
      <div id="meEmail" style="margin-bottom:6px;word-break:break-all"></div>
      <a href="/" target="_blank" rel="noopener">View website ↗</a> · <a href="#" id="logout">Sign out</a>
    </div>
  </aside>
  <main>
    <div class="mobile-head">
      <div class="brand"><b>WNP</b><span>Admin</span></div>
      <a class="btn btn-sm" href="/" target="_blank" rel="noopener">Website ↗</a>
    </div>
    <div id="view"><div class="loading"><span class="spinner"></span></div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="dh"><button class="ib" id="dBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><h2 id="dTitle"></h2></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   WNP Admin – one page that controls queries, products, offers, website
   text and notifications. Keys are read from /api/config (Vercel env).
   ===================================================================== */
var db, CFG, ME = null, SESSION = null;
var S = { queries: [], products: [], offers: [], faqs: [], settings: [], admins: [] };
var qFilter = 'all', qSearch = '', view = 'queries';
var STATUSES = ['new', 'contacted', 'quoted', 'won', 'lost', 'spam'];
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t, kind, onClick) {
  var el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.textContent = t;
  if (onClick) el.onclick = function () { onClick(); el.remove(); };
  $('#toasts').appendChild(el); setTimeout(function () { el.remove(); }, kind === 'gold' ? 8000 : 3200);
}
function ago(d) {
  var s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fullDate(d) { return new Date(d).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function flag(cc) { cc = (cc || '').toUpperCase(); if (!/^[A-Z]{2}$/.test(cc)) return ''; return String.fromCodePoint.apply(null, cc.split('').map(function (c) { return 127397 + c.charCodeAt(0); })); }
function slugify(s) { return String(s).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'item'; }
function digits(s) { return String(s || '').replace(/[^\d]/g, ''); }
function typeLabel(t) { t = (t || '').toLowerCase(); return t === 'order' ? 'Quote request' : t === 'sample' ? 'Paid sample' : 'Enquiry'; }
function bgImg(u) { return u ? "background-image:url('" + String(u).replace(/'/g, '%27') + "')" : ''; }
function fail(e) { console.error(e); toast((e && e.message) || 'Something went wrong', 'bad'); }

/* ---------------- start ---------------- */
(async function init() {
  try {
    CFG = await fetch('/api/config').then(function (r) { return r.json(); });
  } catch (e) { CFG = {}; }
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
    document.body.innerHTML = '<div style="padding:40px;max-width:560px;margin:auto;font-family:sans-serif"><h2>Setup not finished</h2><p style="margin-top:10px">Add <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> in Vercel → Project → Settings → Environment Variables, then redeploy.</p></div>';
    return;
  }
  db = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).catch(console.error);
  navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'open') { var u = new URL(e.data.url); var id = u.searchParams.get('q'); if (id) openQuery(id); }
  });

  db.auth.onAuthStateChange(function (event, session) {
    SESSION = session;
    if (event === 'PASSWORD_RECOVERY') { showLogin(true); return; }
    if (event === 'SIGNED_OUT') showLogin(false);
  });
  var r = await db.auth.getSession();
  SESSION = r.data.session;
  if (SESSION) startApp(); else showLogin(false);
})();

/* ---------------- login ---------------- */
function showLogin(reset) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#loginFields').classList.toggle('hidden', !!reset); $('#resetFields').classList.toggle('hidden', !reset);
  $('#loginSub').textContent = reset ? 'Choose a new password.' : 'Sign in to see queries and manage your website.';
}
$('#loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var m = $('#lg_msg'), b = $('#lg_btn'); m.className = 'msg'; m.textContent = ''; b.disabled = true; b.textContent = 'Signing in…';
  var r = await db.auth.signInWithPassword({ email: $('#lg_email').value.trim(), password: $('#lg_pass').value });
  b.disabled = false; b.textContent = 'Sign in';
  if (r.error) { m.className = 'msg bad'; m.textContent = r.error.message === 'Invalid login credentials' ? 'Wrong email or password.' : r.error.message; return; }
  SESSION = r.data.session; startApp();
});
$('#lg_forgot').onclick = async function () {
  var m = $('#lg_msg'), em = $('#lg_email').value.trim();
  if (!em) { m.className = 'msg bad'; m.textContent = 'Type your email first.'; return; }
  var r = await db.auth.resetPasswordForEmail(em, { redirectTo: location.origin + '/admin/' });
  m.className = r.error ? 'msg bad' : 'msg ok'; m.textContent = r.error ? r.error.message : 'Check your email for a reset link.';
};
$('#lg_set').onclick = async function () {
  var m = $('#lg_msg'), p = $('#lg_new').value;
  if (p.length < 8) { m.className = 'msg bad'; m.textContent = 'At least 8 characters.'; return; }
  var r = await db.auth.updateUser({ password: p });
  if (r.error) { m.className = 'msg bad'; m.textContent = r.error.message; return; }
  history.replaceState(null, '', '/admin/'); startApp();
};
$('#logout').onclick = async function (e) { e.preventDefault(); await db.auth.signOut(); location.href = '/admin/'; };

/* ---------------- app ---------------- */
async function startApp() {
  var u = await db.auth.getUser();
  ME = u.data.user;
  if (!ME) return showLogin(false);
  var a = await db.from('admins').select('user_id').eq('user_id', ME.id).maybeSingle();
  if (!a.data) {
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    $('#lg_msg').className = 'msg bad'; $('#lg_msg').textContent = 'This account does not have admin access.';
    await db.auth.signOut(); return;
  }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#meEmail').textContent = ME.email;

  $$('#nav a').forEach(function (a) { a.onclick = function () { go(a.dataset.v); }; });
  await loadQueries();
  listenLive();

  var p = new URLSearchParams(location.search);
  var startView = (location.hash || '').replace('#', '') || 'queries';
  if (startView === 'offers') { contentTab = 'offers'; startView = 'content'; }
  go(['queries', 'products', 'content', 'website', 'settings'].indexOf(startView) > -1 ? startView : 'queries');
  checkPendingReviews();
  if (p.get('q')) openQuery(p.get('q'));
  clearBadge();
}

function go(v) {
  view = v; history.replaceState(null, '', '/admin/#' + v);
  $$('#nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.v === v); });
  closeAllDrawers();
  window.scrollTo(0, 0);
  ({ queries: renderQueries, products: renderProducts, content: renderContent, website: renderWebsite, settings: renderSettings })[v]();
}

/* =====================================================================
   QUERIES
   ===================================================================== */
async function loadQueries() {
  var r = await db.from('queries').select('*').order('created_at', { ascending: false }).limit(2000);
  if (r.error) return fail(r.error);
  S.queries = r.data; updateBadge();
}
function updateBadge() {
  var n = S.queries.filter(function (q) { return q.status === 'new'; }).length;
  var b = $('#navBadge'); b.textContent = n; b.classList.toggle('hidden', !n);
  document.title = n ? '(' + n + ') WNP Admin' : 'WNP Admin';
  if (navigator.setAppBadge) { try { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) {} }
}
function clearBadge() { if (navigator.clearAppBadge && !S.queries.some(function (q) { return q.status === 'new'; })) try { navigator.clearAppBadge(); } catch (e) {} }

function listenLive() {
  db.channel('queries-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'queries' }, function (p) {
      if (p.eventType === 'INSERT') {
        S.queries.unshift(p.new);
        beep();
        toast('New query from ' + p.new.name + ' – tap to open', 'gold', function () { go('queries'); openQuery(p.new.id); });
      } else if (p.eventType === 'UPDATE') {
        var i = S.queries.findIndex(function (q) { return q.id === p.new.id; }); if (i > -1) S.queries[i] = p.new;
      } else if (p.eventType === 'DELETE') {
        S.queries = S.queries.filter(function (q) { return q.id !== p.old.id; });
      }
      updateBadge();
      if (view === 'queries' && !drawerStack.length) renderQueries(true);
    })
    .subscribe();
  // refresh when the app comes back to the screen (phone unlocked etc.)
  document.addEventListener('visibilitychange', function () { if (!document.hidden) loadQueries().then(function () { if (view === 'queries' && !drawerStack.length) renderQueries(true); }); });
}
function beep() {
  try {
    var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .5); o.start(); o.stop(c.currentTime + .5);
  } catch (e) {}
}

function renderQueries(keepScroll) {
  var all = S.queries, now = Date.now();
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var cNew = all.filter(function (q) { return q.status === 'new'; }).length;
  var cToday = all.filter(function (q) { return new Date(q.created_at) >= today; }).length;
  var cWeek = all.filter(function (q) { return now - new Date(q.created_at) < 7 * 864e5; }).length;
  var counts = {}; STATUSES.forEach(function (s) { counts[s] = 0; }); all.forEach(function (q) { counts[q.status] = (counts[q.status] || 0) + 1; });

  var s = qSearch.toLowerCase();
  var list = all.filter(function (q) {
    if (qFilter !== 'all' && q.status !== qFilter) return false;
    if (qFilter === 'all' && q.status === 'spam') return false;
    if (!s) return true;
    return [q.name, q.email, q.phone, q.company, q.country, q.product, q.details].join(' ').toLowerCase().indexOf(s) > -1;
  });

  // where queries come from
  var byC = {};
  all.forEach(function (q) { if (q.status === 'spam') return; var k = (q.country || q.ip_country || 'Unknown').trim(); k = k.charAt(0).toUpperCase() + k.slice(1); byC[k] = (byC[k] || 0) + 1; });
  var cList = Object.keys(byC).map(function (k) { return [k, byC[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
  var cMax = cList.length ? cList[0][1] : 1;
  var byP = {};
  all.forEach(function (q) { if (q.status === 'spam' || !q.product) return; var k = q.product.split(' – ')[0]; byP[k] = (byP[k] || 0) + 1; });
  var pList = Object.keys(byP).map(function (k) { return [k, byP[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
  var pMax = pList.length ? pList[0][1] : 1;

  var sy = window.scrollY;
  $('#view').innerHTML =
    '<div class="top"><h1>Queries</h1><div class="acts"><button class="btn btn-sm" id="qCsv">Export CSV</button><button class="btn btn-sm" id="qRef">Refresh</button></div></div>' +
    '<div class="stats">' +
      '<div class="panel stat hl"><b>' + cNew + '</b><span>New – not answered</span></div>' +
      '<div class="panel stat"><b>' + cToday + '</b><span>Today</span></div>' +
      '<div class="panel stat"><b>' + cWeek + '</b><span>Last 7 days</span></div>' +
      '<div class="panel stat"><b>' + (counts.won || 0) + '</b><span>Won orders</span></div>' +
    '</div>' +
    '<div class="split"><div>' +
      '<div class="toolbar"><input class="in" id="qSearch" placeholder="Search name, email, country, box…" value="' + esc(qSearch) + '"></div>' +
      '<div class="chips" style="margin-bottom:12px">' +
        '<button class="chip' + (qFilter === 'all' ? ' on' : '') + '" data-f="all">All<em>' + (all.length - (counts.spam || 0)) + '</em></button>' +
        STATUSES.map(function (st) { return '<button class="chip' + (qFilter === st ? ' on' : '') + '" data-f="' + st + '">' + st.charAt(0).toUpperCase() + st.slice(1) + '<em>' + (counts[st] || 0) + '</em></button>'; }).join('') +
      '</div>' +
      '<div class="panel qlist">' + (list.length ? list.map(qRow).join('') :
        '<div class="empty"><b>' + (all.length ? 'Nothing here' : 'No queries yet') + '</b>' + (all.length ? 'Try another filter or search.' : 'Queries from your website will appear here instantly.') + '</div>') + '</div>' +
    '</div><div>' +
      '<div class="panel side-box" style="margin-bottom:14px"><h3>Where they come from</h3>' + (cList.length ? cList.map(function (c) { return '<div class="bar"><span>' + esc(c[0]) + '</span><i style="width:' + Math.max(8, c[1] / cMax * 90) + 'px"></i><b>' + c[1] + '</b></div>'; }).join('') : '<p class="hint">No data yet.</p>') + '</div>' +
      '<div class="panel side-box"><h3>Most asked boxes</h3>' + (pList.length ? pList.map(function (c) { return '<div class="bar"><span>' + esc(c[0]) + '</span><i style="width:' + Math.max(8, c[1] / pMax * 70) + 'px"></i><b>' + c[1] + '</b></div>'; }).join('') : '<p class="hint">No data yet.</p>') + '</div>' +
    '</div></div>';

  if (keepScroll) window.scrollTo(0, sy);
  var si = $('#qSearch');
  si.oninput = function () { qSearch = si.value; var pos = si.selectionStart; renderQueries(true); var n = $('#qSearch'); n.focus(); n.setSelectionRange(pos, pos); };
  $$('.chip[data-f]').forEach(function (c) { c.onclick = function () { qFilter = c.dataset.f; renderQueries(); }; });
  $$('.q').forEach(function (r) { r.onclick = function () { openQuery(r.dataset.id); }; });
  $('#qCsv').onclick = exportCsv;
  $('#qRef').onclick = function () { loadQueries().then(function () { renderQueries(); toast('Updated'); }); };
}
function qRow(q) {
  var cc = q.ip_country;
  return '<div class="q' + (q.status === 'new' ? ' new' : '') + '" data-id="' + q.id + '">' +
    '<span class="dot"></span>' +
    '<div class="who"><b>' + esc(q.name) + '</b><span>' + (flag(cc) ? flag(cc) + ' ' : '') + esc(q.country || cc || '') + (q.company ? ' · ' + esc(q.company) : '') + '</span></div>' +
    '<div class="what"><span class="type-tag">' + typeLabel(q.request_type) + '</span><b>' + esc(q.product || '—') + '</b><span>' + (q.quantity ? q.quantity + ' pcs' : '') + (q.box_size ? ' · ' + esc(q.box_size) : '') + '</span></div>' +
    '<div class="meta"><span class="pill st-' + q.status + '">' + q.status + '</span>' + ago(q.created_at) + '</div>' +
  '</div>';
}

async function openQuery(id) {
  var q = S.queries.find(function (x) { return x.id === id; });
  if (!q) { var r = await db.from('queries').select('*').eq('id', id).maybeSingle(); q = r.data; if (!q) return toast('Query not found', 'bad'); S.queries.unshift(q); }
  var wa = digits(q.phone);
  var first = (q.name || '').split(' ')[0];
  var waMsg = 'Hi ' + first + ', this is WNP Enterprise. Thank you for your query' + (q.product ? ' about the ' + q.product : '') + (q.quantity ? ' (' + q.quantity + ' pcs)' : '') + '. ';
  var mailSub = 'Re: your ' + typeLabel(q.request_type).toLowerCase() + (q.product ? ' – ' + q.product : '') + ' | WNP Enterprise';
  var kv = [
    ['Received', fullDate(q.created_at)], ['Type', typeLabel(q.request_type)], ['Box / design', q.product], ['Quantity', q.quantity ? q.quantity + ' pcs' : ''],
    ['Box size', q.box_size], ['Details', q.details], ['Name', q.name], ['Email', q.email], ['Phone', q.phone], ['Company', q.company], ['Country', q.country]
  ].filter(function (x) { return x[1] !== '' && x[1] != null; });
  var src = [
    ['Detected location', [q.ip_city, q.ip_country].filter(Boolean).join(', ') + (flag(q.ip_country) ? ' ' + flag(q.ip_country) : '')],
    ['Sent from page', q.page_url], ['Came from', q.referrer || 'Direct / typed the address'],
    ['Email alert', q.email_sent ? 'Sent ✓' : 'Not sent'], ['Phones notified', q.push_sent || 0]
  ].filter(function (x) { return x[1] !== '' && x[1] != null; });

  openDrawer(q.name, function (body, foot) {
    body.innerHTML =
      '<div class="acts3">' +
        (wa ? '<a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/' + wa + '?text=' + encodeURIComponent(waMsg) + '">WhatsApp</a>' : '<button class="btn" disabled>No phone</button>') +
        '<a class="btn btn-dark" href="mailto:' + esc(q.email) + '?subject=' + encodeURIComponent(mailSub) + '&body=' + encodeURIComponent('Hi ' + first + ',\n\n') + '">Email</a>' +
        (wa ? '<a class="btn" href="tel:+' + wa + '">Call</a>' : '<button class="btn" id="qCopy">Copy email</button>') +
      '</div>' +
      '<div class="row2"><div class="field"><label class="l">Status</label><select class="in" id="qStatus">' + STATUSES.map(function (s) { return '<option value="' + s + '"' + (q.status === s ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'; }).join('') + '</select></div><div></div></div>' +
      '<div class="panel"><dl class="kv">' + kv.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl></div>' +
      '<p class="sec-t">Your notes (only your team sees these)</p>' +
      '<textarea class="in" id="qNotes" placeholder="e.g. Sent price £2.40/box on WhatsApp, waiting for logo…">' + esc(q.notes || '') + '</textarea>' +
      '<p class="sec-t">Where it came from</p>' +
      '<div class="panel"><dl class="kv">' + src.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl></div>';
    foot.innerHTML = '<button class="btn btn-red" id="qDel">Delete</button><span class="grow"></span><button class="btn btn-dark" id="qSave">Save</button>';

    var c = $('#qCopy', body); if (c) c.onclick = function () { navigator.clipboard.writeText(q.email); toast('Email copied'); };
    $('#qStatus', body).onchange = async function () {
      var v = this.value;
      await saveQ({ status: v }, 'Status updated');
      if (v === 'won' && confirm('Order won! Send ' + (q.name || 'the buyer') + ' a link to leave a review?')) askReview(q);
    };
    $('#qSave', foot).onclick = function () { saveQ({ notes: $('#qNotes', body).value, status: $('#qStatus', body).value }, 'Saved'); };
    $('#qDel', foot).onclick = async function () {
      if (!confirm('Delete this query permanently?')) return;
      var r = await db.from('queries').delete().eq('id', q.id); if (r.error) return fail(r.error);
      S.queries = S.queries.filter(function (x) { return x.id !== q.id; }); updateBadge(); closeDrawer(); renderQueries(true); toast('Deleted');
    };
  }, function () { if (view === 'queries') renderQueries(true); });

  // opening a new query marks it as seen -> "contacted" is set by you; we leave status as is
  async function saveQ(patch, msg) {
    var r = await db.from('queries').update(patch).eq('id', q.id).select().single();
    if (r.error) return fail(r.error);
    Object.assign(q, r.data); updateBadge(); toast(msg);
  }
}

function exportCsv() {
  var cols = ['created_at', 'status', 'request_type', 'product', 'quantity', 'box_size', 'details', 'name', 'email', 'phone', 'company', 'country', 'ip_country', 'ip_city', 'page_url', 'referrer', 'notes'];
  var lines = [cols.join(',')].concat(S.queries.map(function (q) { return cols.map(function (c) { var v = q[c] == null ? '' : String(q[c]); return '"' + v.replace(/"/g, '""') + '"'; }).join(','); }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }));
  a.download = 'wnp-queries-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* =====================================================================
   PHOTOS (upload, resize, gallery)
   ===================================================================== */
function resizeImage(file, max) {
  max = max || 1800;
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) {
        if (b && b.type === 'image/webp') return resolve(b);   // smaller and faster
        c.toBlob(function (j) { j ? resolve(j) : reject(new Error('Could not read photo')); }, 'image/jpeg', 0.86);
      }, 'image/webp', 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('This file is not a photo the browser can read (try JPG or PNG).')); };
    img.src = url;
  });
}
async function uploadPhoto(file, folder) {
  var blob = await resizeImage(file);
  var webp = blob.type === 'image/webp';
  var path = folder + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + (webp ? '.webp' : '.jpg');
  var r = await db.storage.from('media').upload(path, blob, { contentType: webp ? 'image/webp' : 'image/jpeg', cacheControl: '31536000', upsert: false });
  if (r.error) throw r.error;
  return db.storage.from('media').getPublicUrl(path).data.publicUrl;
}
function removeStored(url) {
  var m = String(url).split('/storage/v1/object/public/media/')[1];
  if (m) db.storage.from('media').remove([decodeURIComponent(m)]).catch(function () {});
}
// Renders an editable photo list into `el`. `get()` returns the array, `set(arr)` saves it.
// `alts` (optional) = { get(), set(arr) } for the photo descriptions Google reads
function gallery(el, get, set, folder, single, alts) {
  function altArr() { var a = alts ? (alts.get() || []).slice() : []; while (a.length < get().length) a.push(''); return a.slice(0, get().length); }
  function draw(uploading) {
    var arr = get(), al = altArr();
    el.innerHTML = '<div class="gallery">' + arr.map(function (u, i) {
      return '<div class="gwrap"><div class="gimg" style="' + bgImg(u) + '">' + (i === 0 && !single ? '<span class="cov">Cover</span>' : '') +
        '<div class="gact">' + (single ? '<span></span>' : '<button type="button" data-a="left" data-i="' + i + '" title="Move left">‹</button>') +
        '<button type="button" data-a="del" data-i="' + i + '" title="Remove" style="color:#c0392b">✕</button>' +
        (single ? '' : '<button type="button" data-a="right" data-i="' + i + '" title="Move right">›</button>') + '</div></div>' +
        (alts ? '<input class="in alt-in" data-alt="' + i + '" placeholder="Describe photo" value="' + esc(al[i] || '') + '" title="Photo description for Google, e.g. Black magnetic perfume box with gold foil logo">' : '') + '</div>';
    }).join('') + (uploading ? Array(uploading).fill('<div class="uploading"><span class="spinner"></span></div>').join('') : '') +
      ((single && arr.length) ? '' : '<label class="gadd"><input type="file" accept="image/*" ' + (single ? '' : 'multiple') + '><span>＋<br>Add photo' + (single ? '' : 's') + '</span></label>') + '</div>';
    $$('button[data-a]', el).forEach(function (b) {
      b.onclick = function () {
        var a = get().slice(), al = altArr(), i = +b.dataset.i;
        function sw(x, y) { var t = a[x]; a[x] = a[y]; a[y] = t; var t2 = al[x]; al[x] = al[y]; al[y] = t2; }
        if (b.dataset.a === 'del') { if (!confirm('Remove this photo?')) return; removeStored(a[i]); a.splice(i, 1); al.splice(i, 1); }
        if (b.dataset.a === 'left' && i > 0) sw(i - 1, i);
        if (b.dataset.a === 'right' && i < a.length - 1) sw(i, i + 1);
        set(a); if (alts) alts.set(al); draw();
      };
    });
    $$('input[data-alt]', el).forEach(function (x) {
      x.oninput = function () { var al = altArr(); al[+x.dataset.alt] = x.value; alts.set(al); };
    });
    var inp = $('input[type=file]', el);
    if (inp) inp.onchange = async function () {
      var files = Array.prototype.slice.call(inp.files); if (!files.length) return;
      draw(files.length);
      var a = get().slice();
      for (var i = 0; i < files.length; i++) {
        try { a.push(await uploadPhoto(files[i], folder)); } catch (e) { fail(e); }
      }
      set(a); if (alts) alts.set(altArr()); draw();
    };
  }
  draw();
}

// One-time: finds photos already in the website's images folder and links them
async function importPhotos() {
  var btn = $('#pImport'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Looking for photos…';
  var EXTS = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG', 'WEBP'], FOLDERS = ['/images/', '/Images/', '/image/', '/img/', '/'];
  function probe(u) { return new Promise(function (res) { var i = new Image(); i.onload = function () { res(u); }; i.onerror = function () { res(null); }; i.src = u; }); }
  async function find(name) {
    for (var f = 0; f < FOLDERS.length; f++) {
      var found = await Promise.all(EXTS.map(function (x) { return probe(FOLDERS[f] + name + '.' + x); }));
      var hit = found.find(Boolean); if (hit) return hit;
    }
    return null;
  }
  var n = 0;
  for (var i = 0; i < S.products.length; i++) {
    var p = S.products[i];
    var cover = await find(p.slug);
    if (cover && !p.images.length) { await db.from('products').update({ images: [cover] }).eq('id', p.id); n++; }
    for (var k = 0; k < p.designs.length; k++) {
      var d = p.designs[k];
      if (d.images.length) continue;
      var ph = await find(p.slug + '-' + (k + 1));
      if (ph) { await db.from('designs').update({ images: [ph] }).eq('id', d.id); n++; }
    }
  }
  toast(n ? n + ' photos imported' : 'No photos found in the website folder', n ? '' : 'bad');
  renderProducts();
}

    if (!changed.length) return toast('No changes');
    this.disabled = true;
    var res = await Promise.all(changed.map(function (el) { return db.from('site_settings').update({ value: el.value }).eq('key', el.dataset.k); }));
    this.disabled = false;
    var bad = res.find(function (r) { return r.error; }); if (bad) return fail(bad.error);
    changed.forEach(function (el) { S.settings.find(function (x) { return x.key === el.dataset.k; }).value = el.value; });
    toast('Saved – live on website in a few seconds');
  };
  $('#fAdd').onclick = function () { editFaq(null); };
  $$('[data-f]').forEach(function (r) { r.onclick = function () { editFaq(r.dataset.f); }; });
}
function editFaq(id) {
  var f = id ? S.faqs.find(function (x) { return x.id === id; }) : { question: '', answer: '', is_active: true, sort_order: S.faqs.length + 1 };
  openDrawer(id ? 'Edit question' : 'New question', function (body, foot) {
    body.innerHTML =
      '<label class="switch" style="margin-bottom:16px"><input type="checkbox" id="f_on"' + (f.is_active ? ' checked' : '') + '><i></i>Show on website</label>' +
      '<div class="field"><label class="l">Question *</label><input class="in" id="f_q" value="' + esc(f.question) + '"></div>' +
      '<div class="field"><label class="l">Answer</label><textarea class="in" id="f_a" style="min-height:120px">' + esc(f.answer || '') + '</textarea></div>' +
      '<div class="field"><label class="l">Position (1 = first)</label><input class="in" type="number" id="f_s" value="' + esc(f.sort_order) + '"></div>';
    foot.innerHTML = (id ? '<button class="btn btn-red" id="f_del">Delete</button>' : '') + '<span class="grow"></span><button class="btn btn-dark" id="f_save">Save</button>';
    $('#f_save', foot).onclick = async function () {
      var row = { question: $('#f_q', body).value.trim(), answer: $('#f_a', body).value.trim(), is_active: $('#f_on', body).checked, sort_order: parseInt($('#f_s', body).value, 10) || 0 };
      if (!row.question) return toast('Question is required', 'bad');
      var r = id ? await db.from('faqs').update(row).eq('id', id) : await db.from('faqs').insert(row);
      if (r.error) return fail(r.error); toast('Saved'); closeDrawer();
    };
    var del = $('#f_del', foot);
    if (del) del.onclick = async function () { if (!confirm('Delete this question?')) return; var r = await db.from('faqs').delete().eq('id', id); if (r.error) return fail(r.error); toast('Deleted'); closeDrawer(); };
  }, function () { if (view === 'website') renderWebsite(); });
}

/* =====================================================================
   ALERTS (push notifications) + TEAM
   ===================================================================== */
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function b64ToBytes(b) { var p = '='.repeat((4 - b.length % 4) % 4), s = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
async function currentSub() { if (!('serviceWorker' in navigator)) return null; var reg = await navigator.serviceWorker.ready; return reg.pushManager ? reg.pushManager.getSubscription() : null; }

async function renderSettings() {
  $('#view').innerHTML = '<div class="loading"><span class="spinner"></span></div>';
  var supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  var sub = supported ? await currentSub() : null;
  var perm = 'Notification' in window ? Notification.permission : 'unsupported';
  var on = !!sub && perm === 'granted';
  var r = await db.from('admins').select('*').order('created_at'); S.admins = r.data || [];

  var alertBox;
  if (isIOS() && !isStandalone()) {
    alertBox = '<div class="notice"><b>iPhone: add the panel to your Home Screen first.</b><br>1. Open this page in <b>Safari</b>.<br>2. Tap the <b>Share</b> button (square with arrow).<br>3. Tap <b>Add to Home Screen</b> → Add.<br>4. Open <b>WNP Admin</b> from your Home Screen, sign in, and come back here to switch on alerts.</div>';
  } else if (!supported || !CFG.vapidPublicKey) {
    alertBox = '<div class="notice">' + (!CFG.vapidPublicKey ? 'Push keys are not set yet (VAPID_PUBLIC_KEY in Vercel).' : 'This browser does not support notifications. Use Chrome on Android/laptop or Safari on iPhone (from the Home Screen).') + '</div>';
  } else if (perm === 'denied') {
    alertBox = '<div class="notice"><b>Notifications are blocked</b> for this site. Allow them in your browser/phone settings for this site, then reload.</div>';
  } else alertBox = '';

  $('#view').innerHTML =
    '<div class="top"><h1>Alerts &amp; Team</h1></div>' +
    '<div class="panel sgroup"><h3>Notifications on this device</h3>' + alertBox +
      '<p style="margin-bottom:14px">' + (on ? '✅ This device gets an alert for every new query, even when the panel is closed.' : 'Get an instant alert on this phone or laptop for every new website query.') + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        (on ? '<button class="btn btn-dark" id="pTest">Send test notification</button><button class="btn" id="pOff">Turn off on this device</button>'
            : '<button class="btn btn-gold" id="pOn"' + ((isIOS() && !isStandalone()) || !supported || perm === 'denied' || !CFG.vapidPublicKey ? ' disabled' : '') + '>Turn on notifications</button>') +
      '</div><p class="hint" style="margin-top:10px">Turn this on separately on each phone/laptop you want alerts on. Every team member does the same on their own phone.</p></div>' +
    '<div class="panel sgroup"><h3>Install as an app</h3><p class="hint" style="font-size:14px">' +
      (isStandalone() ? '✅ You are using the installed app.' : (isIOS() ? 'Safari → Share → <b>Add to Home Screen</b>.' : 'Chrome menu (⋮) → <b>Install app</b> or <b>Add to Home screen</b>.') + ' The panel then opens full-screen with its own icon, like a normal app.') + '</p></div>' +
    '<div class="panel sgroup"><h3>Team</h3><div class="rows" style="margin-bottom:14px">' +
      S.admins.map(function (a) { return '<div class="rowi"><div class="tx"><b>' + esc(a.email || a.user_id) + (a.user_id === ME.id ? ' (you)' : '') + '</b><span>Added ' + new Date(a.created_at).toLocaleDateString('en-GB') + '</span></div>' + (a.user_id === ME.id ? '' : '<button class="ib red" data-rm="' + a.user_id + '" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>') + '</div>'; }).join('') +
    '</div><p class="sec-t">Add team member</p><div class="row2"><div class="field"><label class="l">Email</label><input class="in" id="t_email" type="email" placeholder="name@gmail.com"></div><div class="field"><label class="l">Password (min 8)</label><input class="in" id="t_pass" type="text" placeholder="They can change it later"></div></div>' +
    '<button class="btn btn-dark" id="t_add">Add to team</button><p class="hint" style="margin-top:8px">Share the email and password with them. They sign in at <b>' + esc(location.origin) + '/admin</b>. To get query emails too, add their email to NOTIFY_EMAILS in Vercel.</p></div>' +
    '<div class="panel sgroup"><h3>Account</h3><div class="row2"><div class="field"><label class="l">New password</label><input class="in" id="me_pass" type="password" placeholder="Min 8 characters"></div><div class="field" style="display:flex;align-items:flex-end"><button class="btn" id="me_set">Change my password</button></div></div></div>';

  var bOn = $('#pOn'); if (bOn) bOn.onclick = enablePush;
  var bOff = $('#pOff'); if (bOff) bOff.onclick = disablePush;
  var bT = $('#pTest'); if (bT) bT.onclick = testPush;
  $('#t_add').onclick = addMember;
  $$('[data-rm]').forEach(function (b) { b.onclick = function () { removeMember(b.dataset.rm); }; });
  $('#me_set').onclick = async function () {
    var p = $('#me_pass').value; if (p.length < 8) return toast('At least 8 characters', 'bad');
    var r = await db.auth.updateUser({ password: p }); if (r.error) return fail(r.error); $('#me_pass').value = ''; toast('Password changed');
  };
}
async function enablePush() {
  try {
    var perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications were not allowed', 'bad'); return renderSettings(); }
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(CFG.vapidPublicKey) });
    var j = sub.toJSON();
    var r = await db.from('push_subscriptions').upsert({ user_id: ME.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, device: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
    if (r.error) throw r.error;
    toast('Notifications are on ✅');
    renderSettings();
    setTimeout(testPush, 600);
  } catch (e) { fail(e); }
}
async function disablePush() {
  var sub = await currentSub();
  if (sub) { await db.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  toast('Notifications turned off on this device'); renderSettings();
}
async function testPush() {
  var s = (await db.auth.getSession()).data.session;
  var r = await fetch('/api/push-test', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } }).then(function (x) { return x.json(); }).catch(function () { return {}; });
  if (r.ok && r.sent) toast('Test sent to ' + r.sent + ' device' + (r.sent > 1 ? 's' : ''));
  else toast('Test could not be sent – check VAPID keys in Vercel', 'bad');
}
async function addMember() {
  var em = $('#t_email').value.trim(), pw = $('#t_pass').value;
  var s = (await db.auth.getSession()).data.session;
  var r = await fetch('/api/team', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token }, body: JSON.stringify({ email: em, password: pw }) }).then(function (x) { return x.json(); }).catch(function () { return { error: 'Network error' }; });
  if (!r.ok) return toast(r.error || 'Could not add', 'bad');
  toast(em + ' added to the team'); renderSettings();
}
async function removeMember(uid) {
  if (!confirm('Remove this person from the panel? Their login will be deleted.')) return;
  var s = (await db.auth.getSession()).data.session;
  var r = await fetch('/api/team', { method: 'DELETE', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token }, body: JSON.stringify({ user_id: uid }) }).then(function (x) { return x.json(); }).catch(function () { return {}; });
  if (!r.ok) return toast(r.error || 'Could not remove', 'bad');
  toast('Removed'); renderSettings();
}

/* =====================================================================
   DRAWER (stack, so a design can open on top of its product)
   ===================================================================== */
var drawerStack = [];
function openDrawer(title, render, onClose) {
  drawerStack.push({ title: title, render: render, onClose: onClose });
  paintDrawer();
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); document.body.style.overflow = 'hidden';
}
function paintDrawer() {
  var top = drawerStack[drawerStack.length - 1]; if (!top) return;
  $('#dTitle').textContent = top.title; $('#dBody').innerHTML = ''; $('#dFoot').innerHTML = ''; $('#dBody').scrollTop = 0;
  top.render($('#dBody'), $('#dFoot'));
}
function closeDrawer() {
  var top = drawerStack.pop();
  if (drawerStack.length) paintDrawer();
  else { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); document.body.style.overflow = ''; if (location.search) history.replaceState(null, '', '/admin/#' + view); }
  if (top && top.onClose) top.onClose();
}
function closeAllDrawers() { drawerStack = []; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); document.body.style.overflow = ''; }
$('#dBack').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawerStack.length) closeDrawer(); });
</script>
</body>
</html>
